# ~/working/ansible_project/playbooks/rustdesk_client.yml
#
# Массовая установка и настройка клиента RustDesk на self-hosted hbbs.
#
# Обычно запускается через обёртку:
#   ./deploy_rustdesk.sh --limit 192.168.0.143 --check
#   ./deploy_rustdesk.sh --limit 192.168.0.143
#   ./deploy_rustdesk.sh                 # весь парк
#
# Напрямую:
#   ansible-playbook -i inventory/windows_hosts.yml playbooks/rustdesk_client.yml \
#     -e "rd_server=192.168.0.9" \
#     -e "rd_key=$(cat ~/opt/rmm-ra/rustdesk-data/id_ed25519.pub)" \
#     --ask-pass --limit 192.168.0.143
---
- name: Установка клиента RustDesk
  hosts: all
  gather_facts: true

  roles:
    - role: rustdesk_client
      tags: [rustdesk, client]
