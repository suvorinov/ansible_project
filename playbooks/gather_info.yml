# ~/ansible_project/playbooks/gather_info.yml
# Сбор информации о Windows-хостах: OS, RAM, диск
#
# Запуск:
#   ansible-playbook -i inventory/windows_hosts.yml playbooks/gather_info.yml --limit "192.168.0.90" -e "ansible_password=$ANSIBLE_WINRM_PASSWORD"
---
- name: Сбор информации о Windows-хостах
  hosts: windows_hosts
  gather_facts: no
  ignore_unreachable: yes
  tasks:
    - name: Получить информацию об ОС
      ansible.windows.win_shell: |
        $os = Get-CimInstance Win32_OperatingSystem
        $cs = Get-CimInstance Win32_ComputerSystem
        $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
        $disks = Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3"

        $ram = [math]::Round($cs.TotalPhysicalMemory / 1GB, 2)

        $diskInfo = @()
        foreach ($d in $disks) {
            $total = [math]::Round($d.Size / 1GB, 2)
            $free = [math]::Round($d.FreeSpace / 1GB, 2)
            $used = $total - $free
            $pct = if ($total -gt 0) { [math]::Round(($used / $total) * 100, 1) } else { 0 }
            $diskInfo += "$($d.DeviceID) $used/$total GB ($pct%)"
        }

        Write-Output "OS=$($os.Caption) $($os.Version)"
        Write-Output "HOSTNAME=$($cs.Name)"
        Write-Output "DOMAIN=$($cs.Domain)"
        Write-Output "CPU=$($cpu.Name)"
        Write-Output "CPU_CORES=$($cpu.NumberOfCores)"
        Write-Output "RAM_GB=$ram"
        Write-Output "DISKS=$($diskInfo -join '; ')"
      register: result
      changed_when: false
      ignore_errors: yes

    - name: Вывести информацию
      ansible.builtin.debug:
        msg: "{{ item }}"
      loop: "{{ result.stdout_lines }}"
      when: result.stdout_lines is defined

    - name: Ошибка подключения
      ansible.builtin.debug:
        msg: "Не удалось получить информацию с {{ inventory_hostname }}"
      when: result is failed
